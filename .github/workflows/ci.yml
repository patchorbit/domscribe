name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

      - name: Verify browser harness build cleanup
        run: node --test scripts/fixtures/replay-process.test.mjs

      - name: Verify Docker cloud runner offline
        run: |
          pnpm exec tsx --test scripts/cloud/*.test.ts
          pnpm exec tsc -p scripts/cloud/tsconfig.cloud.json
          pnpm exec eslint scripts/cloud/*.ts --max-warnings=0
          bash -n scripts/cloud/bootstrap.sh
          pnpm exec tsx scripts/cloud/run.ts --help

      - run: pnpm exec nx run-many -t lint test build typecheck --exclude domscribe-test-fixtures

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GIST_SECRET }}
        run: |
          npx nx run domscribe:coverage-badge
          gh api --method PATCH "gists/${{ vars.COVERAGE_GIST_ID }}" \
            -f "files[domscribe-coverage.json][content]=$(cat coverage/shields.json)"

  build-registry:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npx nx run-many -t build --exclude domscribe-test-fixtures

      - name: Start Verdaccio
        run: npx verdaccio --config .verdaccio/config.yml --listen 4873 &

      - name: Wait for Verdaccio
        run: npx wait-on http://localhost:4873 --timeout 30000

      - name: Authenticate to local registry
        run: npm config set //localhost:4873/:_authToken dummy-token

      - name: Publish to local registry
        run: pnpm run registry:publish:only

      - name: Upload registry storage
        uses: actions/upload-artifact@v4
        with:
          name: verdaccio-storage
          path: tmp/local-registry/storage
          retention-days: 1

      - name: Check emitted package dependencies
        run: node scripts/check-dist-dependencies.mjs

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/packages/
          retention-days: 1

  installed-packages:
    runs-on: ubuntu-latest
    needs: build-registry
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
        framework: [react, vue]
        vite: ['5.4.21', '7.3.7']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/packages/
      - name: Verify clean installed modules and shared runtime
        run: node scripts/check-packed-vite.mjs ${{ matrix.package-manager }} ${{ matrix.framework }} ${{ matrix.vite }}

  portable-replay:
    runs-on: ubuntu-latest
    needs: build-registry
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: react-npm-vite7
            framework: react
            package-manager: npm
            version-args: '--vite-version=7.3.7'
          - id: react-pnpm-vite5
            framework: react
            package-manager: pnpm
            version-args: '--vite-version=5.4.21'
          - id: vue-npm-vite7
            framework: vue
            package-manager: npm
            version-args: '--vite-version=7.3.7'
          - id: vue-pnpm-vite5
            framework: vue
            package-manager: pnpm
            version-args: '--vite-version=5.4.21'
          - id: next15-npm-webpack
            framework: next
            package-manager: npm
            version-args: '--framework-version=15.5.28'
          - id: next16-pnpm-turbopack
            framework: next
            package-manager: pnpm
            version-args: '--framework-version=16.4.3'
          - id: nuxt3-npm
            framework: nuxt
            package-manager: npm
            version-args: '--framework-version=3.21.11'
          - id: nuxt4-pnpm
            framework: nuxt
            package-manager: pnpm
            version-args: '--framework-version=4.6.2'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/packages/
      - name: Install Chromium
        run: pnpm --filter @domscribe/test-fixtures exec playwright install --with-deps chromium
      - name: Replay persisted captures in a fresh browser session
        run: >-
          node scripts/verify-instance-replay.mjs
          --framework=${{ matrix.framework }}
          --package-manager=${{ matrix.package-manager }}
          ${{ matrix.version-args }}
          --report-dir=${{ runner.temp }}/portable-replay-evidence
      - name: Retain replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-replay-${{ matrix.id }}
          path: ${{ runner.temp }}/portable-replay-evidence/
          retention-days: 7
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    needs: build-registry
    env:
      DS_MAX_BUILD_OVERHEAD_PERCENT: 75
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - vite-v5-react-18-js
          - vite-v5-react-18-ts
          - vite-v5-vue-3-js
          - vite-v5-vue-3-ts
          - webpack-v5-react-18-js
          - webpack-v5-react-18-ts
          - webpack-v5-react-19-js
          - webpack-v5-react-19-ts
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download registry storage
        uses: actions/download-artifact@v4
        with:
          name: verdaccio-storage
          path: tmp/local-registry/storage

      - name: Start Verdaccio
        run: npx verdaccio --config .verdaccio/config.yml --listen 4873 &

      - name: Wait for Verdaccio
        run: npx wait-on http://localhost:4873 --timeout 30000

      - name: Install fixture
        run: npx nx run domscribe-test-fixtures:install-fixture--${{ matrix.fixture }}

      - name: Run integration tests
        run: npx nx run domscribe-test-fixtures:integration--${{ matrix.fixture }}

  e2e:
    runs-on: ubuntu-latest
    needs: build-registry
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - vite-v5-react-18-js
          - vite-v5-react-18-ts
          - vite-v5-vue-3-js
          - vite-v5-vue-3-ts
          - webpack-v5-react-18-js
          - webpack-v5-react-18-ts
          - webpack-v5-react-19-js
          - webpack-v5-react-19-ts
          - next-v15-js
          - next-v15-ts
          - next-v16-js
          - next-v16-ts
          - nuxt-v3-js
          - nuxt-v3-ts
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @domscribe/test-fixtures exec playwright install --with-deps chromium

      - name: Download registry storage
        uses: actions/download-artifact@v4
        with:
          name: verdaccio-storage
          path: tmp/local-registry/storage

      - name: Start Verdaccio
        run: npx verdaccio --config .verdaccio/config.yml --listen 4873 &

      - name: Wait for Verdaccio
        run: npx wait-on http://localhost:4873 --timeout 30000

      - name: Install fixture
        run: npx nx run domscribe-test-fixtures:install-fixture--${{ matrix.fixture }}

      - name: Run e2e tests
        run: FIXTURE_ID=${{ matrix.fixture }} pnpm --filter @domscribe/test-fixtures exec playwright test --grep ${{ matrix.fixture }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.fixture }}
          path: packages/domscribe-test-fixtures/playwright-report/
          retention-days: 7
